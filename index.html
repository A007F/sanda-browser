<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanda Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط التبويبات -->
  <div id="tab-bar">
    <div class="tab active" id="tab-1">
      <span class="tab-title">تبويب جديد</span>
      <button class="tab-close">✕</button>
    </div>
    <button id="btn-new-tab">+</button>
  </div>

  <!-- شريط التنقل -->
  <div id="navbar">
    <div class="nav-group">
      <button class="nav-btn" id="btn-back" title="للخلف" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="nav-btn" id="btn-forward" title="للأمام" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="nav-btn" id="btn-refresh" title="تحديث">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
      <button class="nav-btn" id="btn-home" title="الصفحة الرئيسية">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
    </div>

    <div id="url-wrapper">
      <div id="url-status">
        <svg id="icon-lock" class="status-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#4ade80" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        <svg id="icon-warning" class="status-icon hidden" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#f87171" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0zM12 9v4M12 17h.01"/></svg>
      </div>
      <input id="url-bar" type="text" placeholder="أدخل رابطاً أو ابحث في Startpage...">
    </div>

    <div class="nav-group">
      <button class="nav-btn" id="btn-shield" title="درع الخصوصية">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </button>
      <button class="nav-btn primary" id="btn-go">انتقال</button>
    </div>
  </div>

  <!-- لوحة الدرع -->
  <div id="shield-panel" class="hidden">
    <div class="shield-header">
      <span>🛡 درع الخصوصية</span>
      <button id="shield-close">✕</button>
    </div>
    <div class="shield-section">
      <div class="shield-row">
        <span>حجب الإعلانات</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-ads" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="shield-row">
        <span>حجب التتبع</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-trackers" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="shield-section">
      <div class="shield-label">شفافية النافذة</div>
      <input type="range" id="opacity-slider" min="50" max="100" value="100">
      <span id="opacity-value">100%</span>
    </div>
  </div>

  <!-- منطقة المحتوى -->
  <div id="content-area">
    <!-- صفحة البداية -->
    <div id="home-page">
      <h1 id="browser-logo">Sanda</h1>
      <input id="home-search" type="text" placeholder="ابحث أو أدخل رابطاً...">
      <button id="home-search-btn">بحث</button>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
